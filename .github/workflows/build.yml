name: Build ClipStack APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: قبول التراخيص وتثبيت SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: صلاحية التشغيل
        run: chmod +x gradlew

      - name: بناء APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: تحقق من وجود APK
        run: |
          echo "=== ملفات APK ==="
          find app/build/outputs -name "*.apk" 2>/dev/null || echo "لا يوجد APK"

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipStack-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: رفع السجل عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            **/*.log
            **/build/outputs/**
          retention-days: 7
